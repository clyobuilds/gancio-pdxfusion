stages:
  - test
  # - build

vitest:
  stage: test
  image: node:24
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm test

