services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    volumes:
      # - ./db:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - MARIADB_AUTO_UPGRADE=true
      - MARIADB_USER=gancio
      - MARIADB_DATABASE=gancio
      - MARIADB_PASSWORD=gancio
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
    restart: always
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--mariadbupgrade"]
      interval: 2s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:15
    container_name: postgres
    volumes:
      # - ./postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_USER=gancio
      - POSTGRES_DB=gancio
      - POSTGRES_PASSWORD=gancio
      # - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U gancio -d gancio'"]
      interval: 2s
      timeout: 5s
      retries: 10        
    restart: always
    ports:
        - 5432:5432